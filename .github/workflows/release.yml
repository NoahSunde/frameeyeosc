# Builds and tests frameeyeosc, eyecam and the panel on every push (scripts/package.sh, in the container of
# .github/build.Dockerfile), and on main publishes the tarball and SHA256SUMS as release v<Cargo.toml's version>
# unless that release exists. get.sh and the panel's update button install the latest one. To publish a new build,
# raise the version in Cargo.toml (and Cargo.lock) and add its section to CHANGELOG.md / CHANGELOG.ja.md.
name: Build and release

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build container
        run: docker build -t frameeyeosc-build -f .github/build.Dockerfile .github

      - name: Build, test and package
        # As uid 1000, the Frame's user, not root (eyecam's tests check file owners and permissions, and eyecam-rec
        # wants that uid), with the crates downloaded into the checkout; FRAMEEYEOSC_BUILD_IMAGE= : package.sh is
        # already inside the build container
        run: |
          mkdir -p .cargo-home
          sudo chown -R 1000:1000 .
          docker run --rm -v "$PWD":/src -w /src -u 1000:1000 \
            -e HOME=/tmp -e CARGO_HOME=/src/.cargo-home -e FRAMEEYEOSC_BUILD_IMAGE= \
            frameeyeosc-build scripts/package.sh
          sudo chown -R "$(id -u):$(id -g)" .

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released; raise the version in Cargo.toml to publish this build"
            exit 0
          fi
          # The notes: the version's CHANGELOG.md section without its heading (the panel shows its first paragraph)
          awk -v v="$version" '
            /^## / { if (on) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { on = 1; next } }
            on { print }
          ' CHANGELOG.md >notes.md
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS --title "$tag" --notes-file notes.md \
            --target "$GITHUB_SHA"
